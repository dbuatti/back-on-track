name: BackOnTrack
options:
  bundleIdPrefix: com.danielebuatti
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  BackOnTrack:
    type: application
    platform: iOS
    sources:
      - path: BackOnTrack
    info:
      path: BackOnTrack/Info.plist
      properties:
        CFBundleDisplayName: Back on Track
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCloudKitUsageDescription: "Sync your daily rhythm across your devices."

    dependencies: []
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "6SPV96FZW9"
        PRODUCT_BUNDLE_IDENTIFIER: "com.danielebuatti.backontrack"